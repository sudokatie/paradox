[package]
name = "paradox"
version = "0.1.0"
edition = "2021"
authors = ["Katie <katie@blackabee.com>"]
description = "SAT/SMT solver with CDCL and theory solvers"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tempfile = "3"
